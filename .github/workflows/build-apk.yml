name: Build Android Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package J.A.R.V.I.S. Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Restore Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            echo "Restoring debug.keystore from repository credentials..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify Generated APK
        id: verify_apk
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Generated APK not found at $APK_PATH" >&2
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "$APK_PATH")
          if [ "$FILE_SIZE" -le 1000 ]; then
            echo "ERROR: APK file is unexpectedly empty or corrupted (size: $FILE_SIZE bytes)" >&2
            exit 1
          fi

          echo "APK successfully verified at $APK_PATH (Size: $FILE_SIZE bytes)"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: J.A.R.V.I.S. Android Debug APK (Build ${{ github.run_number }})
          body: |
            ### J.A.R.V.I.S. AI Assistant - Automated Debug Build
            - **Build Number:** `${{ github.run_number }}`
            - **Commit SHA:** `${{ github.sha }}`
            - **Target:** Android Smartphone & Tablet Adaptive System
            - **Engine:** Google Gemini Neural Model + Native Android Vocal Architecture

            #### Download
            Download the attached `app-debug.apk` directly to your Android device to install and test.
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
